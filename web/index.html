<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="本地运行的秋招投递与面试进度看板"
    />
    <title>秋招进度台</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="dashboard-page">
    <a class="skip-link" href="#main-content">跳到主要内容</a>

    <header class="topbar">
      <div class="brand-block">
        <div class="brand-mark" aria-hidden="true">秋</div>
        <div>
          <strong>秋招进度台</strong>
          <span>所有数据只保存在这台电脑</span>
        </div>
      </div>
      <nav class="top-actions" aria-label="页面操作">
        <a class="button button-quiet" href="/api/export.csv">导出 CSV</a>
        <a class="button button-primary" href="/widget">快速录入</a>
      </nav>
    </header>

    <main id="main-content" class="dashboard-shell">
      <section class="hero-panel" aria-labelledby="page-title">
        <div class="hero-copy">
          <p class="date-line" id="today-label">正在读取日期</p>
          <h1 id="page-title">把每一次推进，<br />都留在同一条主线上。</h1>
          <p>
            同公司、同部门的测评、笔试和多轮面试会自动合并，完整保留每一次结果。
          </p>
        </div>
        <div class="hero-summary" aria-live="polite">
          <span>当前待处理</span>
          <strong id="hero-pending">0</strong>
          <small>项进度等待你确认结果</small>
        </div>
      </section>

      <section class="metrics-grid" aria-label="秋招概览">
        <article class="metric metric-dark">
          <span>求职主线</span>
          <strong id="metric-applications">0</strong>
          <small>公司与部门组合</small>
        </article>
        <article class="metric">
          <span>即将进行</span>
          <strong id="metric-upcoming">0</strong>
          <small>今天及之后的待办</small>
        </article>
        <article class="metric">
          <span>阶段通过率</span>
          <strong><span id="metric-pass-rate">0</span><i>%</i></strong>
          <small>已确认结果的阶段</small>
        </article>
        <article class="metric metric-accent">
          <span>Offer</span>
          <strong id="metric-offers">0</strong>
          <small>继续保持节奏</small>
        </article>
      </section>

      <section class="workspace-grid">
        <aside class="schedule-panel" aria-labelledby="schedule-title">
          <div class="section-heading">
            <div>
              <h2 id="schedule-title">近期日程</h2>
              <p>按日期排列待完成事项</p>
            </div>
            <span class="count-label" id="schedule-count">0 项</span>
          </div>
          <div id="schedule-list" class="schedule-list" aria-live="polite">
            <div class="skeleton schedule-skeleton"></div>
            <div class="skeleton schedule-skeleton"></div>
          </div>
        </aside>

        <section class="pipeline-panel" aria-labelledby="pipeline-title">
          <div class="pipeline-toolbar">
            <div class="section-heading">
              <div>
                <h2 id="pipeline-title">公司进度</h2>
                <p>每个部门一行，阶段按时间追加</p>
              </div>
            </div>
            <div class="filters">
              <label class="search-field">
                <span>搜索公司或部门</span>
                <input
                  id="search-input"
                  type="search"
                  placeholder="例如：字节跳动"
                  autocomplete="off"
                />
              </label>
              <label class="select-field">
                <span>筛选阶段</span>
                <select id="stage-filter">
                  <option value="">全部阶段</option>
                  <option>已投递</option>
                  <option>测评</option>
                  <option>笔试</option>
                  <option>面试</option>
                  <option>Offer</option>
                </select>
              </label>
            </div>
          </div>

          <div class="legend" aria-label="阶段颜色说明">
            <span><i class="legend-swatch stage-applied"></i>投递</span>
            <span><i class="legend-swatch stage-assessment"></i>测评</span>
            <span><i class="legend-swatch stage-written"></i>笔试</span>
            <span><i class="legend-swatch stage-interview"></i>面试</span>
            <span><i class="legend-swatch stage-offer"></i>Offer</span>
          </div>

          <div id="pipeline-list" class="pipeline-list" aria-live="polite">
            <div class="skeleton pipeline-skeleton"></div>
            <div class="skeleton pipeline-skeleton"></div>
            <div class="skeleton pipeline-skeleton"></div>
          </div>
        </section>
      </section>
    </main>

    <dialog id="event-editor" class="event-dialog" aria-labelledby="event-editor-title">
      <form id="event-editor-form">
        <header>
          <div>
            <p>调整这一次进度</p>
            <h2 id="event-editor-title">修改记录</h2>
          </div>
          <button
            class="dialog-close"
            type="button"
            data-close-editor
            aria-label="关闭"
          >×</button>
        </header>
        <input id="editor-event-id" type="hidden" />
        <div class="dialog-fields">
          <label>
            <span>当前阶段</span>
            <select id="editor-stage" required>
              <option>已投递</option>
              <option>测评</option>
              <option>笔试</option>
              <option>一面</option>
              <option>二面</option>
              <option>三面</option>
              <option>四面</option>
              <option>HR面</option>
              <option>Offer</option>
            </select>
          </label>
          <label>
            <span>日期与时间</span>
            <input id="editor-scheduled-at" type="datetime-local" />
          </label>
          <label>
            <span>备注</span>
            <textarea id="editor-notes" rows="3" placeholder="岗位编号、准备重点等"></textarea>
          </label>
          <label id="editor-code-field">
            <span>手撕代码</span>
            <textarea id="editor-code-problem" rows="3" placeholder="例如：LRU 缓存、反转链表"></textarea>
          </label>
        </div>
        <p id="editor-error" class="dialog-error" role="alert"></p>
        <footer>
          <button class="button button-quiet" type="button" data-close-editor>
            取消
          </button>
          <button class="button button-primary" type="submit">保存修改</button>
        </footer>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="/app.js" defer></script>
  </body>
</html>
